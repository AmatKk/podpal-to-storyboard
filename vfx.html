<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VFX dron test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --bg:#e3e7e9; --sheet:#fafbfb; --ink:#26292d; --shade:#c7cdd2; --muted:#5f676e;
  --line:#c2c9ce; --blue:#3f97cf; --fire:#e2601a; --ok:#2f8a57;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141719; --sheet:#1e2226; --ink:#dde2e5; --shade:#3b4248; --muted:#9aa3aa;
  --line:#343b41; --blue:#58aee0; --fire:#ff7b35; --ok:#5cc28a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141719; --sheet:#1e2226; --ink:#dde2e5; --shade:#3b4248; --muted:#9aa3aa;
  --line:#343b41; --blue:#58aee0; --fire:#ff7b35; --ok:#5cc28a; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
img{max-width:100%;display:block}
.wrap{max-width:1100px;margin:0 auto;padding-block:40px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:grid;gap:16px;padding-bottom:26px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow a{color:inherit}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,80px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--fire)}
.lead{max-width:68ch;margin:0;color:var(--muted)}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.steps li{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);padding:4px 10px;color:var(--muted)}
.steps li.done{border-color:var(--ok);color:var(--ok)}
.steps li.now{border-color:var(--fire);color:var(--fire)}
.log{display:grid;gap:28px;margin-top:36px}
.entry{background:var(--sheet);border:1px solid var(--line);padding:22px 22px 24px;display:grid;gap:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.meta .step{color:var(--fire);text-transform:uppercase;letter-spacing:.1em}
.entry h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-transform:uppercase}
.entry p{margin:0;max-width:75ch}
.entry ul{margin:0;padding-left:20px;max-width:75ch}
.entry figure{margin:4px 0 0;display:grid;gap:6px}
.entry figure img{width:100%;background:#000;cursor:zoom-in}
.entry figcaption{font-family:var(--mono);font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
table{border-collapse:collapse;font-size:14px;width:100%;max-width:760px}
td,th{border-bottom:1px solid var(--line);padding:6px 10px 6px 0;text-align:left;vertical-align:top}
th{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;z-index:9}
.lb img{max-height:100%;width:auto}
[hidden],.lb[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow"><a href="./">Podpáľ to a choď pešo</a> · VFX skúška · <a href="https://miro.com/app/board/uXjVEd28bMs=/" target="_blank" rel="noopener" style="color:var(--blue)">Miro board ↗</a></div>
    <h1>Dron záber · <em>CG pozadie</em></h1>
    <p class="lead">Skúšobný dronový záber: z plate ostáva len cesta, auto a tráva pri krajnici, všetko ostatné nahrádza CG sídlisko, vedenie a rafinéria z Blendru. Denník práce, najnovšie hore.</p>
    <ul class="steps" id="steps"></ul>
  </header>
  <main class="log" id="log"></main>
</div>
<div class="lb" id="lb" hidden><img alt=""></div>
<script src="vfx/log.js"></script>
<script>
const S=window.VFX_STEPS||[], L=window.VFX_LOG||[];
document.getElementById("steps").innerHTML=S.map(s=>`<li class="${s.state||""}">${s.name}</li>`).join("");
document.getElementById("log").innerHTML=L.map(e=>`<article class="entry">
  <div class="meta"><span class="step">${e.step}</span><span>${e.when}</span></div>
  <h2>${e.title}</h2>${e.html||""}
  ${e.video?`<figure><video src="vfx/img/${e.video.src}" controls loop muted playsinline preload="metadata" style="width:100%;background:#000;display:block"></video><figcaption>${e.video.cap||""}</figcaption></figure>`:""}
  ${(e.imgs||[]).length?`<div class="${e.imgs.length>1?"grid2":""}">${e.imgs.map(i=>`<figure><img loading="lazy" src="vfx/img/${i.src}" alt="${i.cap||""}"><figcaption>${i.cap||""}</figcaption></figure>`).join("")}</div>`:""}
</article>`).join("");
const lb=document.getElementById("lb");
document.addEventListener("click",ev=>{const t=ev.target;
  if(t.matches(".entry figure img")){lb.querySelector("img").src=t.src;lb.hidden=false}
  else if(lb.contains(t)){lb.hidden=true}});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")lb.hidden=true});
</script>
</body>
</html>
